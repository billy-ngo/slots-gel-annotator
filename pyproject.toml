[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slotsgeltool"
version = "1.0.1"
description = "Slots Gel Annotator — vector-native gel annotation tool with publication-ready SVG / PNG export."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Billy Ngo", email = "billy.ngo0108@gmail.com"},
]
keywords = [
    "gel",
    "electrophoresis",
    "annotation",
    "biology",
    "bioinformatics",
    "molecular-biology",
    "ladder",
    "SVG",
    "publication",
    "slots",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    # Core image stack — used for raw decoding, channel-max conversion,
    # LUT preview generation, and saturation overlay rendering.
    "numpy>=1.24",
    "Pillow>=10.0",
    "tifffile>=2023.1.0",
    # scipy provides the morphological operations used by the
    # saturation-overlay endpoint. Pure-Python fallback is in place if
    # the import fails, but scipy is widely available so we depend on
    # it directly to avoid silently degraded output on common installs.
    "scipy>=1.10",
    # Web stack — Slots Gel Annotator runs as a local FastAPI server
    # and serves a single-page frontend. uvicorn[standard] pulls in
    # httptools + websockets for the best local-loopback performance.
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
# `slots` is the user-facing command — short, easy to type, brand-aligned.
# `gel-annotator` is kept as an alias so anyone who knew the original
# pre-rebrand command still gets to the same launcher; pyproject's
# entry-point list lets us register both with a single binding.
slots = "gel_annotator.cli:main"
gel-annotator = "gel_annotator.cli:main"

[project.urls]
Homepage = "https://github.com/billy-ngo/slots-gel-annotator"
Repository = "https://github.com/billy-ngo/slots-gel-annotator"
Issues = "https://github.com/billy-ngo/slots-gel-annotator/issues"
Changelog = "https://github.com/billy-ngo/slots-gel-annotator/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["gel_annotator*"]

[tool.setuptools.package-data]
# Ship the entire frontend directory (HTML, JS, CSS) and any bundled
# icon assets. The frontend is the application's UI; without it the
# backend has nothing to serve.
gel_annotator = [
    "frontend/*",
    "frontend/**/*",
    "assets/*",
    "*.ico",
    "*.png",
]
